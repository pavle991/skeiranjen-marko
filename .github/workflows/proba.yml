name: Proba najave
on:
  workflow_dispatch: {}
  push:
    paths: [".github/probe-now"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/probe-najava.mjs
        env:
          SP_TOKEN: ${{ secrets.SP_TOKEN }}
